[package]
name = "igc"
description = "A fast, minimal parser for IGC flight recorder files"
version = "0.3.0"
authors = ["Joe Roberts <joe@jwjr.co.uk>"]
repository = "https://github.com/Joey9801/igc-rs"
documentation = "https://docs.rs/igc"
readme = "README.md"
license = "MIT"
edition = "2018"
keywords = ["igc", "gliding", "gps", "parser", "aviation"]
categories = ["parser-implementations", "aerospace"]

[dependencies]
serde = { version = "1.0.126", features = ["derive"], optional = true }
thiserror = "1.0"

[dev-dependencies]
approx = "0.5.0"
criterion = "0.3.4"
encoding = "0.2.33"
proptest = "1.0.0"
serde_json = "1.0.64"

[[bench]]
name = "benchmark"
harness = false

# Only built when the `serde` feature is enabled, so `cargo test`/`cargo build --examples`
# succeed with default features.
[[example]]
name = "serde"
required-features = ["serde"]
